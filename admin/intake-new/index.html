<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — New Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div id="admin-chrome"></div>

<main class="admin-main">
  <a href="/admin/intakes/" class="admin-back-link">&larr; Pending Intake</a>

  <div class="admin-list-heading">
    <h1>New Intake</h1>
  </div>

  <div id="error-banner" class="admin-error-banner" style="display:none"></div>

  <section class="admin-section">
    <h2>Screenshots</h2>
    <p class="admin-field-hint">Add one or more screenshots from the same client conversation. The CRM will combine them into a single intake.</p>

    <ul id="shot-list" class="admin-photo-grid" style="display:none"></ul>
    <div id="shot-empty" class="admin-empty">No screenshots added yet.</div>

    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" multiple hidden>
    <div class="admin-form-actions">
      <button type="button" id="add-btn" class="admin-btn admin-btn-outline">+ Add Screenshots</button>
    </div>
  </section>

  <div class="admin-form-actions">
    <button type="button" id="extract-btn" class="admin-btn admin-btn-primary" disabled>Extract Information</button>
  </div>

  <div id="progress" class="admin-alert admin-alert-neutral" style="display:none"></div>
</main>

<script src="../admin-chrome.js"></script>
<script src="../admin-fetch.js"></script>
<script src="../nav-badge.js"></script>
<script src="../intake-new.js"></script>
</body>
</html>
