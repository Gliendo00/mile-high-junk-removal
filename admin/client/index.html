<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Client Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <a class="admin-brand" href="/admin/">
    <img class="admin-brand-logo" src="../../images/mile-high-junk-removal-logo.webp" alt="">
    <span class="admin-brand-word">Mile High Admin</span>
  </a>
  <div class="admin-topbar-actions">
    <button type="button" id="logout-btn" class="admin-btn admin-btn-ghost">Log Out</button>
  </div>
</div>

<nav class="admin-nav-tabs" aria-label="Admin sections">
  <a href="/admin/" class="admin-nav-tab">Schedule</a>
  <a href="/admin/requests/" class="admin-nav-tab">Requests<span class="admin-nav-badge" id="nav-badge-requests" hidden>0</span></a>
  <a href="/admin/clients/" class="admin-nav-tab is-active" aria-current="page">Clients</a>
  <a href="/admin/expenses/" class="admin-nav-tab">Expenses</a>
</nav>

<main class="admin-main">
  <a href="/admin/clients/" class="admin-back-link">&larr; All clients</a>

  <div id="error-banner" class="admin-error-banner" style="display:none"></div>
  <div id="loading" class="admin-loading">Loading client…</div>

  <div id="detail" style="display:none">

    <!-- 1. Client identity -->
    <div class="admin-detail-hero">
      <h1 id="c-name">—</h1>
      <div class="admin-detail-sub" id="c-subtitle">—</div>
    </div>

    <!-- 2. Contact information / communication actions -->
    <section class="admin-section">
      <h2>Contact</h2>
      <div class="admin-row">
        <div class="admin-row-label">Phone</div>
        <div class="admin-row-value"><a id="c-phone-link" class="admin-tap-link" href="tel:">—</a></div>
      </div>
      <div class="admin-row" id="c-email-row" style="display:none">
        <div class="admin-row-label">Email</div>
        <div class="admin-row-value"><a id="c-email-link" class="admin-tap-link" href="mailto:">—</a></div>
      </div>
      <div class="admin-row">
        <div class="admin-row-label">Address</div>
        <div class="admin-row-value" id="c-address">—</div>
      </div>

      <div class="admin-contact-actions is-triple">
        <a id="c-call-btn" class="admin-quick-btn admin-quick-primary" href="tel:">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Call
        </a>
        <a id="c-text-btn" class="admin-quick-btn admin-quick-primary" href="sms:">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5v-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Text
        </a>
        <a id="c-email-btn" class="admin-quick-btn admin-quick-secondary" href="mailto:">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 7l7.5 6 7.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Email
        </a>
      </div>
    </section>

    <!-- 3. Job / booking history -->
    <section class="admin-section">
      <h2>Job History</h2>
      <div id="job-empty" class="admin-empty" style="display:none">No jobs yet.</div>
      <ul id="job-list" class="admin-booking-list" style="display:none"></ul>
    </section>

  </div>
</main>

<script src="../admin-fetch.js"></script>
<script src="../nav-badge.js"></script>
<script src="../client-detail.js"></script>
</body>
</html>
