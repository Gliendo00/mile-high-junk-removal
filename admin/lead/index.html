<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Lead Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div id="admin-chrome"></div>

<main class="admin-main">
  <a href="/admin/leads/" class="admin-back-link">&larr; All leads</a>

  <div id="error-banner" class="admin-error-banner" style="display:none"></div>
  <div id="loading" class="admin-loading">Loading lead…</div>

  <div id="detail" style="display:none">

    <!-- 1. Lead identity + status -->
    <div class="admin-detail-hero">
      <div class="admin-detail-top">
        <h1 id="l-name">—</h1>
        <span id="l-status-badge" class="admin-status-badge admin-status-new">
          <span id="l-status-label">New</span>
        </span>
      </div>
      <div class="admin-detail-sub" id="l-subtitle">—</div>
    </div>

    <!-- 2. Contact information / communication actions -->
    <section class="admin-section">
      <h2>Contact</h2>
      <div class="admin-row">
        <div class="admin-row-label">Phone</div>
        <div class="admin-row-value"><a id="l-phone-link" class="admin-tap-link" href="tel:">—</a></div>
      </div>
      <div class="admin-row" id="l-email-row" style="display:none">
        <div class="admin-row-label">Email</div>
        <div class="admin-row-value"><a id="l-email-link" class="admin-tap-link" href="mailto:">—</a></div>
      </div>
      <div class="admin-row">
        <div class="admin-row-label">Address</div>
        <div class="admin-row-value" id="l-address">—</div>
      </div>

      <div class="admin-contact-actions is-triple">
        <a id="l-call-btn" class="admin-quick-btn admin-quick-primary" href="tel:">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Call
        </a>
        <a id="l-text-btn" class="admin-quick-btn admin-quick-primary" href="sms:">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5v-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Text
        </a>
        <a id="l-email-btn" class="admin-quick-btn admin-quick-secondary" href="mailto:">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 7l7.5 6 7.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Email
        </a>
      </div>
    </section>

    <!-- 3. Job / service details -->
    <section class="admin-section">
      <h2>Job Details</h2>
      <div class="admin-row">
        <div class="admin-row-label">Service Type</div>
        <div class="admin-row-value" id="l-service">—</div>
      </div>
      <div class="admin-row">
        <div class="admin-row-label">Details</div>
        <div class="admin-row-value" id="l-service-details">—</div>
      </div>
      <div class="admin-row">
        <div class="admin-row-label">Estimated Load Size</div>
        <div class="admin-row-value" id="l-load-size">—</div>
      </div>
      <div class="admin-row">
        <div class="admin-row-label">Quoted Amount</div>
        <div class="admin-row-value" id="l-quoted-amount">—</div>
      </div>
      <div class="admin-row" id="l-followup-row" style="display:none">
        <div class="admin-row-label">Next Follow-Up</div>
        <div class="admin-row-value" id="l-followup-date">—</div>
      </div>
    </section>

    <!-- 4. Matched client, when this lead points at an existing customer -->
    <section class="admin-section" id="l-matched-section" style="display:none">
      <h2>Matched Client</h2>
      <div class="admin-row">
        <div class="admin-row-value">
          <a id="l-matched-client-link" class="admin-tap-link" href="#">—</a>
        </div>
      </div>
    </section>

    <!-- 5. Internal notes -->
    <section class="admin-section admin-section-muted" id="l-notes-section" style="display:none">
      <h2>Internal Notes</h2>
      <div class="admin-row-value" id="l-notes">—</div>
    </section>

    <!-- 6. Metadata / provenance -->
    <section class="admin-section admin-section-muted">
      <h2>Details</h2>
      <div class="admin-row">
        <div class="admin-row-label">Source</div>
        <div class="admin-row-value" id="l-source">—</div>
      </div>
      <div class="admin-row">
        <div class="admin-row-label">Added</div>
        <div class="admin-row-value" id="l-created">—</div>
      </div>
      <div class="admin-row" id="l-source-intake-row" style="display:none">
        <div class="admin-row-value">
          <a id="l-source-intake-link" class="admin-tap-link" href="#">View original intake &rarr;</a>
        </div>
      </div>
    </section>

  </div>
</main>

<div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>

<script src="../admin-chrome.js"></script>
<script src="../admin-fetch.js"></script>
<script src="../nav-badge.js"></script>
<script src="../phone-format.js"></script>
<script src="../lead-detail.js"></script>
</body>
</html>
