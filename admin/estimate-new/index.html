<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — New Estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div id="admin-chrome"></div>

<main class="admin-main">
  <a href="/admin/" class="admin-back-link">&larr; Schedule</a>

  <div class="admin-list-heading">
    <h1>New Estimate</h1>
  </div>

  <div id="error-banner" class="admin-error-banner" style="display:none"></div>
  <div id="loading" class="admin-loading">Loading…</div>

  <form id="new-estimate-form" novalidate style="display:none">

    <div class="admin-form-section">
      <div class="admin-form-section-label">Client</div>
      <div id="client-picker-mount"></div>
    </div>

    <div class="admin-form-section">
      <div class="admin-form-section-label">Estimate Info</div>

      <div class="admin-field">
        <label for="appointment-date">Estimate Date</label>
        <input type="date" id="appointment-date">
      </div>

      <div class="admin-field">
        <label id="time-mode-label">Estimate Time</label>
        <div class="admin-segmented" id="time-mode-toggle">
          <button type="button" class="admin-segmented-btn" data-mode="exact">Exact Time</button>
          <button type="button" class="admin-segmented-btn is-active" data-mode="window">Time Window</button>
        </div>
        <select id="time-window">
          <option value="" selected disabled>Select time</option>
        </select>
        <input type="time" id="exact-time" step="60" style="display:none">
      </div>

      <div class="admin-field">
        <label for="service-type">Service Type (optional)</label>
        <select id="service-type">
          <option value="" selected>Not sure yet</option>
          <option value="junk_removal">Junk Removal</option>
          <option value="dumpster_rental">15-Yard Dumpster Rental</option>
          <option value="light_demo">Light Demo</option>
        </select>
      </div>
    </div>

    <div class="admin-form-section">
      <div class="admin-form-section-label">Service Address</div>

      <label class="admin-checkbox-row">
        <input type="checkbox" id="same-as-client-address" disabled>
        <span>Same as client's address on file</span>
      </label>

      <div class="admin-field">
        <label for="service-address">Street Address</label>
        <input type="text" id="service-address" autocomplete="off">
      </div>
      <div class="admin-field-row">
        <div class="admin-field">
          <label for="service-city">City</label>
          <input type="text" id="service-city" autocomplete="off">
        </div>
        <div class="admin-field">
          <label for="service-state">State</label>
          <input type="text" id="service-state" maxlength="2" value="CO" autocomplete="off">
        </div>
        <div class="admin-field">
          <label for="service-zip">ZIP (optional)</label>
          <input type="text" id="service-zip" inputmode="numeric" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="admin-form-section">
      <div class="admin-field">
        <label for="quoted-amount">Ballpark Quote (optional)</label>
        <div class="admin-quote-input-wrap">
          <span class="admin-quote-dollar">$</span>
          <input type="number" id="quoted-amount" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 350">
        </div>
        <span class="admin-field-hint">Informational only — never counted as revenue.</span>
      </div>

      <div class="admin-field">
        <label for="description">What's being estimated (optional)</label>
        <textarea id="description" rows="2" placeholder="What's being removed, scope, etc."></textarea>
      </div>

      <div class="admin-field">
        <label for="estimate-notes">Estimate Notes (optional)</label>
        <textarea id="estimate-notes" rows="2" placeholder="Access notes, what to expect on site, etc."></textarea>
      </div>
    </div>

    <button type="submit" id="save-btn" class="admin-btn admin-btn-primary admin-login-submit">Save Estimate</button>
  </form>
</main>

<div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>

<script src="../admin-chrome.js"></script>
<script src="../admin-fetch.js"></script>
<script src="../nav-badge.js"></script>
<script src="../phone-format.js"></script>
<script src="../client-picker.js"></script>
<script src="../address-autocomplete.js"></script>
<script src="../estimate-new.js"></script>
</body>
</html>
