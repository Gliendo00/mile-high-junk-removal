<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Past Job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <a class="admin-brand" href="/admin/">
    <img class="admin-brand-logo" src="../../images/mile-high-junk-removal-logo.webp" alt="">
    <span class="admin-brand-word">Mile High Admin</span>
  </a>
  <div class="admin-topbar-actions">
    <button type="button" id="logout-btn" class="admin-btn admin-btn-ghost">Log Out</button>
  </div>
</div>

<nav class="admin-nav-tabs" aria-label="Admin sections">
  <a href="/admin/" class="admin-nav-tab is-active" aria-current="page">Schedule</a>
  <a href="/admin/requests/" class="admin-nav-tab">Requests<span class="admin-nav-badge" id="nav-badge-requests" hidden>0</span></a>
  <a href="/admin/clients/" class="admin-nav-tab">Clients</a>
</nav>

<main class="admin-main">
  <a href="/admin/" class="admin-back-link">&larr; Schedule</a>

  <div class="admin-list-heading">
    <h1>Past Job</h1>
  </div>

  <div id="error-banner" class="admin-error-banner" style="display:none"></div>
  <div id="loading" class="admin-loading">Loading…</div>

  <form id="past-job-form" novalidate style="display:none">

    <div class="admin-form-section">
      <div class="admin-form-section-label">Client</div>
      <div id="client-picker-mount"></div>
    </div>

    <div class="admin-form-section">
      <div class="admin-field-row">
        <div class="admin-field">
          <label for="appointment-date">Job Date</label>
          <input type="date" id="appointment-date">
        </div>
        <div class="admin-field">
          <label for="service-type">Service Type</label>
          <select id="service-type">
            <option value="junk_removal">Junk Removal</option>
            <option value="dumpster_rental">15-Yard Dumpster Rental</option>
            <option value="light_demo">Light Demo</option>
          </select>
        </div>
      </div>
    </div>

    <div class="admin-form-section">
      <div class="admin-form-section-label">Service Address</div>
      <div class="admin-field">
        <label for="service-address">Street Address</label>
        <input type="text" id="service-address" autocomplete="off">
      </div>
      <div class="admin-field-row">
        <div class="admin-field">
          <label for="service-city">City</label>
          <input type="text" id="service-city" autocomplete="off">
        </div>
        <div class="admin-field">
          <label for="service-state">State</label>
          <input type="text" id="service-state" maxlength="2" value="CO" autocomplete="off">
        </div>
        <div class="admin-field">
          <label for="service-zip">ZIP</label>
          <input type="text" id="service-zip" inputmode="numeric" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="admin-form-section">
      <div class="admin-field-row">
        <div class="admin-field">
          <label for="actual-price">Actual Job Amount (optional)</label>
          <input type="number" id="actual-price" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 250">
        </div>
        <div class="admin-field">
          <label for="tip-amount">Tip Amount (optional)</label>
          <input type="number" id="tip-amount" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 20">
        </div>
      </div>

      <div class="admin-field">
        <label for="time-window">Time (optional)</label>
        <select id="time-window">
          <option value="" selected>Time unknown / optional</option>
        </select>
      </div>

      <div class="admin-field">
        <label for="description">Description / Details (optional)</label>
        <textarea id="description" rows="2" placeholder="What's being removed, access notes, etc."></textarea>
      </div>

      <div class="admin-field">
        <label for="internal-notes">Private Notes (optional)</label>
        <textarea id="internal-notes" rows="2" placeholder="Gate code, only visible to you"></textarea>
      </div>
    </div>

    <button type="submit" id="save-btn" class="admin-btn admin-btn-primary admin-login-submit">Save Past Job</button>
  </form>

  <div id="success-panel" class="admin-form-section" style="display:none">
    <div class="admin-success-title">Past Job Saved</div>
    <div class="admin-success-meta" id="success-meta"></div>
    <div class="admin-duplicate-card-actions">
      <button type="button" id="view-job-btn" class="admin-btn admin-btn-primary">View Job</button>
      <button type="button" id="add-another-btn" class="admin-btn admin-btn-outline">Add Another Past Job</button>
    </div>
  </div>
</main>

<div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>

<script src="../nav-badge.js"></script>
<script src="../client-picker.js"></script>
<script src="../address-autocomplete.js"></script>
<script src="../booking-past.js"></script>
</body>
</html>
