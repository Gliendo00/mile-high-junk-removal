<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div id="admin-chrome"></div>

<main class="admin-main">
  <div id="error-banner" class="admin-error-banner" style="display:none;margin-bottom:16px"></div>

  <div class="admin-list-heading">
    <h1>Invoices</h1>
    <div class="admin-list-heading-actions">
      <a href="/admin/invoice-new/" class="admin-btn admin-btn-primary">+ New Invoice</a>
    </div>
  </div>

  <div class="admin-search-bar admin-search-bar-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="invoice-search" class="admin-search-input" placeholder="Search invoice number or client name" aria-label="Search invoices" autocomplete="off">
  </div>

  <div id="filter-bar" class="admin-filter-bar" role="tablist" aria-label="Filter invoices by status">
    <button type="button" class="admin-filter-pill is-active" data-status="" role="tab" aria-selected="true">
      <span class="admin-filter-pill-label">All</span>
      <span class="admin-filter-pill-value" id="count-all">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="draft" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Draft</span>
      <span class="admin-filter-pill-value" id="count-draft">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="finalized" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Finalized</span>
      <span class="admin-filter-pill-value" id="count-finalized">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="partially_paid" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Partially Paid</span>
      <span class="admin-filter-pill-value" id="count-partially_paid">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="paid" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Paid</span>
      <span class="admin-filter-pill-value" id="count-paid">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="refunded" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Refunded</span>
      <span class="admin-filter-pill-value" id="count-refunded">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="overdue" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Overdue</span>
      <span class="admin-filter-pill-value" id="count-overdue">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="void" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Void</span>
      <span class="admin-filter-pill-value" id="count-void">—</span>
    </button>
  </div>

  <div id="loading" class="admin-loading">Loading invoices…</div>
  <div id="empty" class="admin-empty" style="display:none">No invoices yet.</div>
  <ul id="invoice-list" class="admin-booking-list" style="display:none"></ul>
</main>

<script src="../admin-chrome.js"></script>
<script src="../admin-fetch.js"></script>
<script src="../nav-badge.js"></script>
<script src="../invoices-list.js"></script>
</body>
</html>
