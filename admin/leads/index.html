<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div id="admin-chrome"></div>

<main class="admin-main">
  <div id="error-banner" class="admin-error-banner" style="display:none;margin-bottom:16px"></div>

  <div class="admin-list-heading">
    <h1>Leads</h1>
  </div>

  <div id="loading" class="admin-loading">Loading leads…</div>
  <div id="empty" class="admin-empty" style="display:none">Nothing waiting in any Leads section right now.</div>

  <!-- Batch 6 follow-up — sub-tabs/pills, one bucket visible at a time.
       Pending Intake is the EXISTING GET /api/admin/intake list
       (status=pending_review), fetched alongside the merged GET
       /api/admin/bookings?view=leads response that backs the other 8 —
       see admin/leads-list.js. Static, always-present buttons (same
       convention as .admin-range-tab on Schedule): JS toggles .is-active
       and each count badge's hidden state, never builds the tab bar
       itself. Horizontally scrollable at phone width — see
       .admin-leads-tabs in admin.css. -->
  <div id="leads-sections" style="display:none">
    <div class="admin-leads-tabs" id="leads-tabs" role="tablist" aria-label="Leads sections">
      <button type="button" class="admin-leads-tab" data-bucket="pendingIntake" role="tab">Pending Intake<span class="admin-nav-badge" id="tab-count-pendingIntake" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="websiteRequests" role="tab">Website Requests<span class="admin-nav-badge" id="tab-count-websiteRequests" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="new" role="tab">New<span class="admin-nav-badge" id="tab-count-new" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="contacted" role="tab">Contacted<span class="admin-nav-badge" id="tab-count-contacted" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="waitingOnPhotos" role="tab">Waiting on Photos<span class="admin-nav-badge" id="tab-count-waitingOnPhotos" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="estimateSent" role="tab">Estimate Sent<span class="admin-nav-badge" id="tab-count-estimateSent" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="followUp" role="tab">Follow Up<span class="admin-nav-badge" id="tab-count-followUp" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="bookedWon" role="tab">Booked/Won<span class="admin-nav-badge" id="tab-count-bookedWon" hidden>0</span></button>
      <button type="button" class="admin-leads-tab" data-bucket="lost" role="tab">Lost<span class="admin-nav-badge" id="tab-count-lost" hidden>0</span></button>
    </div>

    <section class="admin-leads-section" id="section-pendingIntake" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-pendingIntake"></ul>
    </section>

    <section class="admin-leads-section" id="section-websiteRequests" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-websiteRequests"></ul>
    </section>

    <section class="admin-leads-section" id="section-new" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-new"></ul>
    </section>

    <section class="admin-leads-section" id="section-contacted" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-contacted"></ul>
    </section>

    <section class="admin-leads-section" id="section-waitingOnPhotos" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-waitingOnPhotos"></ul>
    </section>

    <section class="admin-leads-section" id="section-estimateSent" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-estimateSent"></ul>
    </section>

    <section class="admin-leads-section" id="section-followUp" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-followUp"></ul>
    </section>

    <section class="admin-leads-section" id="section-bookedWon" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-bookedWon"></ul>
    </section>

    <section class="admin-leads-section" id="section-lost" hidden role="tabpanel">
      <ul class="admin-booking-list" id="list-lost"></ul>
    </section>
  </div>
</main>

<script src="../admin-chrome.js"></script>
<script src="../admin-fetch.js"></script>
<script src="../nav-badge.js"></script>
<script src="../leads-list.js"></script>
</body>
</html>
