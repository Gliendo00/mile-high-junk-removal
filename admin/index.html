<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <span class="admin-brand">Mile High Admin</span>
  <div class="admin-topbar-actions">
    <button type="button" id="logout-btn" class="admin-btn admin-btn-ghost">Log Out</button>
  </div>
</div>

<main class="admin-main">
  <div id="error-banner" class="admin-error-banner" style="display:none;margin-bottom:16px"></div>

  <div id="summary" class="admin-summary-grid" style="display:none">
    <div class="admin-stat">
      <div class="admin-stat-value" id="stat-new">—</div>
      <div class="admin-stat-label">New Requests</div>
    </div>
    <div class="admin-stat">
      <div class="admin-stat-value" id="stat-booked">—</div>
      <div class="admin-stat-label">Booked</div>
    </div>
    <div class="admin-stat">
      <div class="admin-stat-value" id="stat-completed">—</div>
      <div class="admin-stat-label">Completed</div>
    </div>
    <div class="admin-stat">
      <div class="admin-stat-value" id="stat-total">—</div>
      <div class="admin-stat-label">Total Requests</div>
    </div>
  </div>

  <div class="admin-list-heading">
    <h1>Requests</h1>
  </div>

  <div id="loading" class="admin-loading">Loading requests…</div>
  <div id="empty" class="admin-empty" style="display:none">No booking requests yet.</div>
  <ul id="booking-list" class="admin-booking-list" style="display:none"></ul>

  <div id="load-more-wrap" class="admin-load-more" style="display:none">
    <button type="button" id="load-more-btn" class="admin-btn admin-btn-outline">Load more</button>
  </div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
