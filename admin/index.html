<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <a class="admin-brand" href="/admin/">
    <img class="admin-brand-logo" src="../images/mile-high-junk-removal-logo.webp" alt="">
    <span class="admin-brand-word">Mile High Admin</span>
  </a>
  <div class="admin-topbar-actions">
    <button type="button" id="logout-btn" class="admin-btn admin-btn-ghost">Log Out</button>
  </div>
</div>

<nav class="admin-nav-tabs" aria-label="Admin sections">
  <a href="/admin/" class="admin-nav-tab is-active" aria-current="page">Schedule</a>
  <a href="/admin/requests/" class="admin-nav-tab">Requests<span class="admin-nav-badge" id="nav-badge-requests" hidden>0</span></a>
  <a href="/admin/clients/" class="admin-nav-tab">Clients</a>
  <a href="/admin/expenses/" class="admin-nav-tab">Expenses</a>
</nav>

<main class="admin-main">
  <div id="error-banner" class="admin-error-banner" style="display:none;margin-bottom:16px"></div>

  <div class="admin-list-heading">
    <h1>Schedule</h1>
    <div class="admin-list-heading-actions">
      <a href="/admin/booking-past/" class="admin-btn admin-btn-outline">+ Past Job</a>
      <a href="/admin/booking-new/" class="admin-btn admin-btn-primary">+ New Job</a>
    </div>
  </div>

  <div class="admin-range-tabs" role="tablist" aria-label="Schedule range">
    <button type="button" class="admin-range-tab" data-range="yesterday" role="tab" aria-selected="false">Yesterday</button>
    <button type="button" class="admin-range-tab is-active" data-range="today" role="tab" aria-selected="true">Today</button>
    <button type="button" class="admin-range-tab" data-range="tomorrow" role="tab" aria-selected="false">Tomorrow</button>
    <button type="button" class="admin-range-tab" data-range="week" role="tab" aria-selected="false">Week</button>
    <button type="button" class="admin-range-tab" data-range="month" role="tab" aria-selected="false">Month</button>
    <button type="button" class="admin-range-tab" data-range="year" role="tab" aria-selected="false">Year</button>
  </div>

  <!-- Financial counters — Phase 3C Stage 4: Revenue/Booked/Expenses/Net for
       whichever Day/Week/Month range is currently visible. Populated by
       admin/schedule-financials.js's show()/hide(), called from
       admin/schedule.js (Today/Tomorrow/Yesterday/day-nav) and
       admin/calendar-views.js (Week/Month). Hidden entirely on Year, which
       carries no revenue/expense data at all.

       Always a single 4-across row, even at ~375px — see admin.css's own
       header comment on .admin-schedule-financials. Full label text at
       every width (the owner explicitly rejected a REV/EXP-style mobile
       abbreviation — admin.css instead shrinks the label font-size on very
       narrow screens); admin/schedule-financials.js only ever writes the
       *-value spans. -->
  <div id="schedule-financials" class="admin-schedule-financials" hidden>
    <div class="admin-financial-card admin-financial-revenue">
      <span class="admin-financial-label">Revenue</span>
      <span class="admin-financial-value" id="financial-revenue-value">—</span>
    </div>
    <div class="admin-financial-card admin-financial-booked">
      <span class="admin-financial-label">Booked</span>
      <span class="admin-financial-value" id="financial-booked-value">—</span>
    </div>
    <div class="admin-financial-card admin-financial-expenses">
      <span class="admin-financial-label">Expenses</span>
      <span class="admin-financial-value" id="financial-expenses-value">—</span>
    </div>
    <div class="admin-financial-card admin-financial-net" id="financial-net-card">
      <span class="admin-financial-label">Net</span>
      <span class="admin-financial-value" id="financial-net-value">—</span>
    </div>
  </div>

  <!-- Quick Expense — Phase 3C Stage 2.4.2: relocated here, directly under
       the Schedule tabs, so it's always in the same place regardless of
       which range is open. admin/quick-expense.js's showBar()/hideBar()
       mount into and clear this container; its active date always tracks
       whichever single day is currently on screen (Today/Tomorrow/
       Yesterday/a day-nav date, or a tapped day in Week/Month). Hidden
       (via the `hidden` attribute) whenever no single day is in view, e.g.
       Year, or Week/Month before a day is selected. -->
  <div id="quick-expense-bar" class="admin-quick-expense-bar" hidden></div>

  <!-- Today / Tomorrow / Yesterday — Phase 3C Stage 1, Yesterday added
       Stage 2.4.2. Week moved out to its own compact 7-day overview
       (#week-view) in Stage 2.4.1. #day-nav is the restrained previous-day/
       next-day stepper (Stage 2.4.2) — always shows whichever single date
       is currently displayed, independent of which (if any) of the three
       named tabs happens to match it exactly. -->
  <div id="today-tomorrow-view">
    <div class="admin-calendar-nav">
      <button type="button" id="day-nav-prev" class="admin-calendar-nav-btn" aria-label="Previous day">&larr;</button>
      <span id="day-nav-label" class="admin-calendar-nav-label">—</span>
      <button type="button" id="day-nav-next" class="admin-calendar-nav-btn" aria-label="Next day">&rarr;</button>
    </div>
    <div id="loading" class="admin-loading">Loading schedule…</div>
    <div id="empty" class="admin-empty" style="display:none"></div>
    <ul id="schedule-list" class="admin-booking-list" style="display:none"></ul>
  </div>

  <!-- Week — Phase 3C Stage 2.4 (navigable), redesigned Stage 2.4.1 into a
       compact 7-day overview + the same selected-day panel Month uses. -->
  <div id="week-view" hidden>
    <div class="admin-calendar-nav">
      <button type="button" id="week-prev" class="admin-calendar-nav-btn" aria-label="Previous week">&larr;</button>
      <span id="week-range-label" class="admin-calendar-nav-label">—</span>
      <button type="button" id="week-next" class="admin-calendar-nav-btn" aria-label="Next week">&rarr;</button>
    </div>
    <div id="week-current-wrap" style="display:none">
      <button type="button" id="week-current-btn" class="admin-calendar-jump-btn">Jump to this week</button>
    </div>
    <div id="week-loading" class="admin-loading">Loading week…</div>
    <div id="week-error" class="admin-error-banner" style="display:none"></div>
    <div id="week-overview" class="admin-week-overview" style="display:none"></div>
    <div id="week-day-panel" class="admin-day-panel" hidden></div>
  </div>

  <!-- Month — Phase 3C Stage 2.4. #month-current-wrap (Stage 2.4.2) mirrors
       Week's own "Jump to this week" pattern. -->
  <div id="month-view" hidden>
    <div class="admin-calendar-nav">
      <button type="button" id="month-prev" class="admin-calendar-nav-btn" aria-label="Previous month">&larr;</button>
      <span id="month-label" class="admin-calendar-nav-label">—</span>
      <button type="button" id="month-next" class="admin-calendar-nav-btn" aria-label="Next month">&rarr;</button>
    </div>
    <div id="month-current-wrap" style="display:none">
      <button type="button" id="month-current-btn" class="admin-calendar-jump-btn">Jump to today</button>
    </div>
    <div id="month-loading" class="admin-loading">Loading month…</div>
    <div id="month-error" class="admin-error-banner" style="display:none"></div>
    <div id="month-grid" class="admin-month-grid" style="display:none"></div>
    <div id="month-day-panel" class="admin-day-panel" hidden></div>
  </div>

  <!-- Year — Phase 3C Stage 2.4 -->
  <div id="year-view" hidden>
    <div class="admin-calendar-nav">
      <button type="button" id="year-prev" class="admin-calendar-nav-btn" aria-label="Previous year">&larr;</button>
      <span id="year-label" class="admin-calendar-nav-label">—</span>
      <button type="button" id="year-next" class="admin-calendar-nav-btn" aria-label="Next year">&rarr;</button>
    </div>
    <div id="year-loading" class="admin-loading">Loading year…</div>
    <div id="year-error" class="admin-error-banner" style="display:none"></div>
    <div id="year-grid" class="admin-year-grid" style="display:none"></div>
  </div>
</main>

<script src="nav-badge.js"></script>
<script src="schedule-financials.js"></script>
<script src="schedule.js"></script>
<script src="quick-expense.js"></script>
<script src="calendar-views.js"></script>
</body>
</html>
