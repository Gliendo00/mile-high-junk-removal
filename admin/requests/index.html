<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mile High Admin — Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="icon" href="../../images/favicon.png" type="image/png">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">

<div class="admin-topbar">
  <a class="admin-brand" href="/admin/">
    <img class="admin-brand-logo" src="../../images/mile-high-junk-removal-logo.webp" alt="">
    <span class="admin-brand-word">Mile High Admin</span>
  </a>
  <div class="admin-topbar-actions">
    <button type="button" id="logout-btn" class="admin-btn admin-btn-ghost">Log Out</button>
  </div>
</div>

<nav class="admin-nav-tabs" aria-label="Admin sections">
  <a href="/admin/" class="admin-nav-tab">Schedule</a>
  <a href="/admin/requests/" class="admin-nav-tab is-active" aria-current="page">Requests<span class="admin-nav-badge" id="nav-badge-requests" hidden>0</span></a>
  <a href="/admin/clients/" class="admin-nav-tab">Clients</a>
</nav>

<main class="admin-main">
  <div id="error-banner" class="admin-error-banner" style="display:none;margin-bottom:16px"></div>

  <div id="filter-bar" class="admin-filter-bar" style="display:none" role="tablist" aria-label="Filter requests by status">
    <button type="button" class="admin-filter-pill is-active" data-status="" role="tab" aria-selected="true">
      <span class="admin-filter-pill-label">All</span>
      <span class="admin-filter-pill-value" id="count-all">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="new" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">New</span>
      <span class="admin-filter-pill-value" id="count-new">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="booked" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Booked</span>
      <span class="admin-filter-pill-value" id="count-booked">—</span>
    </button>
    <button type="button" class="admin-filter-pill" data-status="completed" role="tab" aria-selected="false">
      <span class="admin-filter-pill-label">Completed</span>
      <span class="admin-filter-pill-value" id="count-completed">—</span>
    </button>
    <button type="button" class="admin-filter-pill admin-filter-more" id="filter-more-btn">
      <span class="admin-filter-more-label">More</span>
      <span class="admin-filter-more-dot" id="more-dot" hidden></span>
    </button>
  </div>

  <div class="admin-list-heading">
    <h1 id="list-heading">Requests</h1>
  </div>

  <div id="loading" class="admin-loading">Loading requests…</div>
  <div id="empty" class="admin-empty" style="display:none">No booking requests yet.</div>
  <ul id="booking-list" class="admin-booking-list" style="display:none"></ul>

  <div id="load-more-wrap" class="admin-load-more" style="display:none">
    <button type="button" id="load-more-btn" class="admin-btn admin-btn-outline">Load more</button>
  </div>
</main>

<script src="../status-ui.js"></script>
<script src="../nav-badge.js"></script>
<script src="../dashboard.js"></script>
</body>
</html>
