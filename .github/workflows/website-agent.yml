name: Website Agent — unattended runner

# Phase 7 — permanent unattended execution path for the ALREADY-BUILT,
# already-deployed Website Agent (agent/cli.js). This workflow does not
# change the Agent's decision logic, audits, or dashboard in any way —
# it only gives the existing `node agent/cli.js --daily`/`--weekly`
# deterministic pass a secure, scheduled-capable place to run.
#
# DELIBERATELY manual-dispatch-only for now (see "on:" below) — no
# `schedule:` trigger exists in this file yet. Enabling a recurring
# cadence is a separate, later, explicitly-authorized change; see
# agent/README.md §13 for the originally-recommended cadence (daily
# 04:00 America/Denver, weekly Sunday 04:00 America/Denver) once that
# step is taken.
#
# Mutation stays OFF: this workflow never passes --apply-safe, so it can
# never write to the public site's own HTML/sitemap/robots/vercel.json —
# only the two Agent-artifact files .github/scripts/safe-commit.js
# allowlists (agent/history/log.ndjson, and, on weekly runs,
# agent/history/research-rotation-state.json) are ever committed back.
#
# If a run comes back `research_pending` (a finding needs external
# research — see agent/README.md §5-8), this workflow does NOT attempt
# to resume it: there is no secure, non-interactive way for a GitHub
# Actions job to perform the Claude-driven research step the existing
# architecture relies on (see agent/README.md §13's own comparison —
# the scheduled-Claude-session model, not this runner, owns that half of
# the lifecycle). The run is still persisted honestly as
# `research_pending`; the existing orchestrator resumes it later via
# `node agent/cli.js --resume=<runId>`, same as today.

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which Agent run to execute"
        type: choice
        options:
          - daily
          - weekly
          # Phase 7D — a narrow, manual, one-off diagnostic: runs ONLY
          # the existing --fetch-firstparty path for one hardcoded
          # request (agent/diagnostics/golden-search-console-request.json)
          # through the SAME GitHub WIF -> impersonation -> Search
          # Console path unattended daily/weekly runs use. Never runs
          # the ordinary Agent pipeline, never touches rotation state,
          # never creates a proposal, never touches the public site —
          # see the dedicated step below and
          # tests/github-actions-workflow.test.js's diagnostic-specific
          # assertions.
          - diagnostic-golden-search-console
          # Phase 7E — the GA4 analog of the diagnostic above: proves the
          # SAME GitHub WIF -> impersonation path against the GA4 Data
          # API specifically (never exercised unattended before this —
          # GA4 has always been reachable only via a human/orchestrator's
          # manual --fetch-firstparty=, never from this runner). Reuses
          # --fetch-firstparty-strict= against a second hardcoded,
          # committed request file
          # (agent/diagnostics/golden-ga4-request.json) — no new Google
          # client, no new auth path, identical gating/safety posture to
          # diagnostic-golden-search-console above (see the dedicated
          # step below and tests/github-actions-workflow.test.js's
          # diagnostic-specific assertions).
          - diagnostic-golden-ga4
        default: daily

permissions:
  contents: write
  id-token: write

concurrency:
  # ONE group for the whole workflow — daily and weekly share it on
  # purpose (not keyed by run_type). Both read/write the same
  # agent/history/log.ndjson and take the same agent/lib/run-lock.js
  # lock FILE, but that lock only protects within a single checkout;
  # two separate GitHub-hosted runner VMs have no shared filesystem, so
  # the actual "never let Daily and Weekly race" guarantee has to come
  # from here. `cancel-in-progress: false` queues a second dispatch
  # instead of cancelling an in-progress run mid-pipeline (which could
  # leave an uncommitted/partial history entry).
  group: website-agent-runner
  cancel-in-progress: false

jobs:
  run-agent:
    name: Run Website Agent (${{ inputs.run_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record workflow start time
        # Generic Website Agent workflow-execution boundary — NOT
        # specific to finding evidence (see agent/lib/report.js's
        # parseWorkflowStartedAt() header for the full root-cause
        # writeup this closes). Exported exactly once, here, via
        # $GITHUB_ENV, which GitHub Actions automatically carries into
        # EVERY later step's own process environment for the rest of
        # this job — no need to re-list WORKFLOW_STARTED_AT in any
        # step's own `env:` block below. Lets the final --daily/--weekly
        # Agent step's report correctly recognize evidence fetched by
        # the earlier --refresh-rotation-evidence/--refresh-finding-
        # evidence steps (weekly only) as "gathered by this workflow,"
        # not "reused from before," even though each of those steps is
        # its own separate `node` process with no shared in-memory
        # state. Unconditional (always set, even for daily/diagnostic
        # dispatches) because it's simply unused there — report.js
        # already defaults to its existing behavior when this is absent,
        # so gating it per run_type would add YAML complexity for zero
        # behavioral difference.
        run: echo "WORKFLOW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Verify required Supabase configuration
        # The brief for this permanent runner: silently skipping proposal
        # sync is no longer acceptable (it was fine for earlier phases'
        # local dry-runs). Fail loudly, before Node even starts, rather
        # than let agent/lib/proposals-sync.js degrade to its normal
        # (otherwise correct) {skipped:true} behavior unnoticed. Never
        # echoes either value.
        # Skipped for the Golden diagnostics (run_type above) — neither
        # mode ever runs the Agent pipeline or proposal sync at all, so
        # Supabase configuration is simply irrelevant to them; requiring
        # it anyway would make a pure Google-auth diagnostic depend on an
        # unrelated credential.
        if: inputs.run_type != 'diagnostic-golden-search-console' && inputs.run_type != 'diagnostic-golden-ga4'
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SECRET_KEY }}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_SECRET_KEY repository/environment secrets are not configured. This permanent runner requires both so CRM proposal sync is never silently skipped. See the setup documentation in the workflow run summary / PR description."
            exit 1
          fi

      - name: Verify required Google Cloud configuration
        run: |
          if [ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER repository/environment variable is not configured (the Workload Identity Federation provider resource name)."
            exit 1
          fi
          if [ -z "${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::GOOGLE_IMPERSONATE_SERVICE_ACCOUNT repository/environment variable is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # Deliberately NOT impersonating a service account here (no
          # `service_account:` input) — that would mint one broad,
          # fixed-scope token for the whole job, which Search Console/
          # GA4 don't accept anyway (they need their own specific
          # webmasters.readonly/analytics.readonly scopes, minted
          # per-call). This step only establishes the FEDERATED base
          # identity; agent/lib/google-auth.js's existing impersonation
          # tier (GOOGLE_IMPERSONATE_SERVICE_ACCOUNT below) does the
          # actual, scope-specific impersonation — exactly the same
          # mechanism already used for local/human ADC. Avoids the
          # redundant-impersonation setup the brief asked to avoid.

      - name: Refresh weekly rotation evidence (weekly only)
        # Phase 7B — closes the "rotation picks a deep-review target but
        # nothing performs the review" gap (see
        # agent/lib/rotation-evidence.js's header for the full root-
        # cause writeup). Run BEFORE the main Agent pass below, mirroring
        # --refresh-completed-jobs's existing precedent: a separate,
        # explicit, network-touching step, never inside the deterministic
        # core. Fetches ONE targeted, already-bounded Search Console
        # query per claimed-but-pageless rotation pick — never a page
        # decision, never external/municipal research (this unattended
        # runner has no research-provider capability for that — see the
        # main run step below and agent/README.md's Phase 7B section).
        if: inputs.run_type == 'weekly'
        run: node agent/cli.js --refresh-rotation-evidence
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}

      - name: Refresh finding-level query evidence (weekly only)
        # Closes the analogous gap for FINDINGS that Phase 7B closed for
        # rotation picks (see agent/lib/finding-evidence.js's header for
        # the full root-cause writeup, and this file's own
        # --refresh-finding-evidence doc comment in agent/cli.js):
        # category-C content-opportunity findings (content-gap,
        # structural-inconsistency) were never eligible for either
        # existing first-party-evidence path, so
        # agent/lib/firstparty-signals.js's query-page-mismatch
        # classifier has never had real qualifying evidence to classify.
        # Run BEFORE the main Agent pass below (same placement/precedent
        # as the rotation-evidence refresh step immediately above, and
        # --refresh-completed-jobs before it), so any evidence fetched
        # here is already on disk by the time --weekly's own report is
        # built and can attach/classify it in the SAME run. Fetches ONE
        # targeted, already-bounded Search Console Search Analytics
        # query per eligible, not-already-fresh candidate finding —
        # never a page decision, never a site change, never touches
        # rotation state, never runs the ordinary Agent pipeline itself
        # (that stays the step below). A candidate whose fetch is
        # skipped or fails writes NO evidence file at all (see
        # finding-evidence.js's header) — never silently mistaken for a
        # genuine zero-row result.
        if: inputs.run_type == 'weekly'
        run: node agent/cli.js --refresh-finding-evidence
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}

      - name: Run Website Agent (${{ inputs.run_type }})
        # Only for daily/weekly — neither Golden diagnostic (run_type
        # above) must EVER run the ordinary Agent pipeline: no scan, no
        # findings, no proposal sync, no rotation, no history/rotation-
        # state write. Without this gate, an unrecognized run_type value
        # would fall through to cli.js's default ("manual" dry-run),
        # which is exactly the full pipeline these diagnostics must not
        # trigger.
        if: inputs.run_type == 'daily' || inputs.run_type == 'weekly'
        run: node agent/cli.js "--${RUN_TYPE}" --json
        env:
          RUN_TYPE: ${{ inputs.run_type }}
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Run Golden Search Console diagnostic (diagnostic only)
        # Phase 7D — a narrow, manual, one-off proof that the GitHub
        # Actions -> WIF -> service-account impersonation -> Search
        # Console path (the exact path unattended daily/weekly runs use
        # — same auth step above, same GOOGLE_IMPERSONATE_SERVICE_ACCOUNT/
        # GSC_SITE_URL, same agent/lib/google-auth.js resolver, same
        # search-console-client.js) actually works end to end, now that
        # GOOGLE_IMPERSONATE_SERVICE_ACCOUNT has been corrected. Reuses
        # the EXISTING --fetch-firstparty-strict= path (no new Google
        # client, no new auth code — see cli.js's own header) against a
        # single, pre-committed, reviewable request file
        # (agent/diagnostics/golden-search-console-request.json — the
        # exact search-analytics/28-day/query-contains-"golden" shape).
        # --fetch-firstparty-strict (NOT the plain, orchestrator-facing
        # --fetch-firstparty) is used deliberately: a skip here
        # (misconfiguration, auth failure, API error) must fail this
        # job visibly, not log-and-return-0 the way an orchestrator-
        # driven fetch correctly does. A real zero-row Search Console
        # response is NOT a skip — fetchFirstPartyEvidence() returns
        # {skipped:false} for it — so it still exits 0 and is still
        # written as a normal, honest, zero-row evidence file.
        #
        # Never runs --daily/--weekly, never calls computePriorities()
        # or research-rotation.js at all, so agent/history/
        # research-rotation-state.json is structurally unreachable from
        # this step — nothing to "not mutate" because nothing in this
        # code path ever touches it in the first place.
        if: inputs.run_type == 'diagnostic-golden-search-console'
        run: node agent/cli.js --fetch-firstparty-strict=agent/diagnostics/golden-search-console-request.json
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}

      - name: Run Golden GA4 diagnostic (diagnostic only)
        # Phase 7E — the GA4 analog of the Golden Search Console
        # diagnostic immediately above: a narrow, manual, one-off proof
        # that the GitHub Actions -> WIF -> service-account impersonation
        # -> GA4 Data API path (the same auth step above, the same
        # GOOGLE_IMPERSONATE_SERVICE_ACCOUNT, agent/lib/google-auth.js's
        # SAME resolver, agent/lib/ga4-client.js) actually works end to
        # end — GA4 has never been exercised unattended before this; it
        # has only ever been reached via a human/orchestrator's manual
        # `--fetch-firstparty=` from a machine with its own ADC login
        # (see agent/README.md's Phase 6 §18/§Remaining-risks). Reuses
        # the EXISTING --fetch-firstparty-strict= path (no new Google
        # client, no new auth code, no new networking implementation —
        # see cli.js's own header; agent/lib/firstparty-fetch.js's
        # fetchGa4Evidence() is the SAME function a human orchestrator's
        # `--fetch-firstparty=` already uses) against a single,
        # pre-committed, reviewable request file
        # (agent/diagnostics/golden-ga4-request.json — a whole-site,
        # 28-day, date-dimension sessions/screenPageViews aggregate;
        # deliberately NOT a landingPage filter for "Golden" — Golden has
        # no dedicated page, so that would mean nothing in GA4; see that
        # file's own `context` field). --fetch-firstparty-strict (NOT the
        # plain, orchestrator-facing --fetch-firstparty) is used
        # deliberately: a skip here (misconfiguration, auth failure, API
        # error) must fail this job visibly, not log-and-return-0 the way
        # an orchestrator-driven fetch correctly does. A real zero-row
        # GA4 response is NOT a skip — fetchFirstPartyEvidence() returns
        # {skipped:false} for it — so it still exits 0 and is still
        # written as a normal, honest, zero-row evidence file.
        #
        # Never runs --daily/--weekly, never calls computePriorities()
        # or research-rotation.js at all, so agent/history/
        # research-rotation-state.json is structurally unreachable from
        # this step — nothing to "not mutate" because nothing in this
        # code path ever touches it in the first place.
        if: inputs.run_type == 'diagnostic-golden-ga4'
        run: node agent/cli.js --fetch-firstparty-strict=agent/diagnostics/golden-ga4-request.json
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}

      - name: Persist Agent artifacts (safe-commit)
        # Runs even if the step above failed: runner.js (see its own
        # header) still persists an honest "failed" record to
        # agent/history/log.ndjson BEFORE re-throwing, and that failure
        # record is itself a legitimate Agent artifact worth keeping —
        # see .github/scripts/safe-commit.js for the actual allowlist/
        # credential-scan logic (also independently unit- and
        # integration-tested — tests/github-actions-safe-commit.test.js).
        # `id: persist` so the Push step below can gate on ITS specific
        # outcome rather than just "did something earlier fail."
        id: persist
        if: always()
        run: |
          node .github/scripts/safe-commit.js "chore(agent): ${{ inputs.run_type }} run $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Push to main
        # Gated on `steps.persist.outcome == 'success'` — NOT a bare
        # `always()`. `always()` alone previously also ran this step
        # when safe-commit itself failed (e.g. the allowlist/credential
        # gate refusing to commit, or the earlier "Author identity
        # unknown" bug) — harmless when nothing had been committed
        # (`git push` with nothing new is a no-op "Everything
        # up-to-date"), but wrong in principle: this step must never
        # even ATTEMPT to push when the step that decides what's safe to
        # commit didn't succeed. `always()` is still needed here too —
        # without it, this step would use the implicit default
        # `if: success()` and get skipped outright whenever the AGENT
        # step above failed, even when persist still correctly committed
        # that failure record and should still be pushed.
        #
        # Never force-pushed: if `main` has moved on since checkout,
        # this fails loudly rather than overwriting anything. One
        # concrete way that happens: re-running an OLD workflow run
        # (GitHub's "Re-run jobs") re-executes against that run's
        # ORIGINAL commit SHA, not main's current tip — if main has
        # since advanced (e.g. a later push fixing this very workflow),
        # that stale checkout's push is correctly rejected as a non-
        # fast-forward ("fetch first"). The fix is to re-dispatch a NEW
        # run (which resolves main's current tip), never to force-push.
        if: always() && steps.persist.outcome == 'success'
        run: git push origin HEAD:main
